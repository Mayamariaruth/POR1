<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <!-- Font awesome -->
    <script
      src="https://kit.fontawesome.com/11ca27fbbb.js"
      crossorigin="anonymous"
    ></script>
    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- JavaScript -->
    <script src="../js/script.js" defer></script>
    <title>Auction House | Maya Thompson</title>
  </head>
  <body>
    <div class="article-container">
      <section class="article">
        <h1>Auction House</h1>
        <p class="caption">Homepage of the Auction House platform.</p>

        <div class="article-image">
          <img
            src="../assets/images/articles/auctionhouse.png"
            alt="Auction House Project Image"
          />
        </div>

        <div class="link-container">
          <div class="links">
            <a
              href="https://mayamariaruth.github.io/auctionhouse/"
              target="_blank"
              class="btn"
              >Live Site</a
            >
            <a
              href="https://github.com/Mayamariaruth/auctionhouse/blob/main/README.md"
              target="_blank"
              class="btn"
              >GitHub README</a
            >
          </div>
          <button class="share-btn" id="shareBtn" title="Copy project link">
            <i class="fa-solid fa-share-from-square"></i>
            Copy Link
          </button>
        </div>

        <div class="content"></div>
      </section>
    </div>
  </body>
</html>
